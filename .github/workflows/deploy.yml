# GitHub Pages 自動部署：main 分支更新時，自動 build Vite 網站並發布
name: 部署個人作品集至 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝鎖定版本的套件
        run: npm ci

      # 先檢查程式碼；建置完成後由 postbuild 自動產生路由備援頁。
      - name: 檢查程式碼
        run: npm run lint

      - name: 建置正式網站
        run: npm run build

      - name: 打包並上傳網站產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 部署個人作品集至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
